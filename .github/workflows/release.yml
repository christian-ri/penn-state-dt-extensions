name: Prepare reviewed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run release:prepare
      - run: npm run test:standalone
      - name: Create draft for final artifact review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.tar.gz release/packages/*.tgz release/SHA256SUMS --draft --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
