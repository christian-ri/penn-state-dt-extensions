name: Extension checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build && npm test && npm run validate
      - run: node scripts/release.mjs
      - name: Require release tag to match the artifact version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("extension.manifest.json","utf8"));if(process.env.RELEASE_TAG!=="v"+m.version)throw Error("Tag must match manifest version");'
      - uses: actions/upload-artifact@v4
        with:
          name: built-extension
          path: release/
          retention-days: 14
  attest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-extension
          path: release/
      - name: Attest exact built bytes without executing project scripts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-extension
          path: release/
      - name: Prepare draft for publisher review; platform installation remains separate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.tar.gz release/SHA256SUMS release/provenance.json --draft --verify-tag --title "$RELEASE_TAG" --notes "Review exact files, data handling and CI before publishing. This release does not install anything on the platform."
